<html lang="es">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Moss — Digital Garden: guías, rutas de aprendizaje, demos y piezas para copiar, aplicadas de verdad en proyectos reales." />
    <meta name="theme-color" content="#faf7ef" />
    <title>Moss — Digital Garden</title>
    <!-- Para compartir y para buscadores. El build cambia canonical, og:url, títulos y descripciones en cada página (scripts/static-pages.ts) -->
    <link rel="canonical" href="https://sergio-velandia.dev/Moss/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Moss — Digital Garden" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:url" content="https://sergio-velandia.dev/Moss/" />
    <meta property="og:title" content="Moss — Digital Garden" />
    <meta property="og:description" content="Moss — Digital Garden: guías, rutas de aprendizaje, demos y piezas para copiar, aplicadas de verdad en proyectos reales." />
    <meta property="og:image" content="https://sergio-velandia.dev/Moss/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Moss — Digital Garden: tu jardín digital de código, con rutas, piezas de Tailwind y guías" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Moss — Digital Garden" />
    <meta name="twitter:description" content="Moss — Digital Garden: guías, rutas de aprendizaje, demos y piezas para copiar, aplicadas de verdad en proyectos reales." />
    <meta name="twitter:image" content="https://sergio-velandia.dev/Moss/og.png" />
    <!-- Aplica el tema antes de pintar para evitar el parpadeo claro → oscuro -->
    <script>
      try {
        var t = localStorage.getItem('moss-theme')
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = t
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute('content', t === 'dark' ? '#141a13' : '#faf7ef')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p style="padding:1rem;font-family:system-ui,sans-serif">Moss necesita JavaScript activado para funcionar.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
