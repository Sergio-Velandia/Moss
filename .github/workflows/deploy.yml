# Publica Moss en GitHub Pages con cada push a main.
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos pushes seguidos, el despliegue en curso se cancela y gana el más reciente
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar datos del sitio
        run: npm run check:publish

      - name: Pruebas
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # GitHub Pages no conoce las rutas de React Router: al recargar /Moss/manual/...
      # sirve 404.html, que es la misma app y resuelve la ruta en el navegador.
      - name: Fallback para rutas de la SPA
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
